<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">착착 자동 스케줄 생성 과정</title>
  <desc id="desc">입력 검증부터 동적 MRV, Lazy 조합, Forward Checking, 중복 제거와 공정성 평가를 거쳐 상위 50개 후보를 반환하는 과정</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0084ff"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #64748b; }
      .step { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Arial, sans-serif; fill: #64748b; }
      .number { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .flow { fill: none; stroke: #0084ff; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fbff"/>
  <circle cx="1490" cy="70" r="180" fill="#e8f3ff"/>
  <circle cx="90" cy="850" r="210" fill="#eef8f4"/>

  <text x="70" y="78" class="title">자동 스케줄 생성 과정</text>
  <text x="70" y="116" class="subtitle">Bounded DFS + Dynamic MRV + Forward Checking + Fairness Top N</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="310" height="150" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="475" y="205" width="310" height="150" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="880" y="205" width="310" height="150" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1285" y="205" width="245" height="150" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>

  <circle cx="110" cy="245" r="22" fill="#0084ff"/><text x="110" y="251" text-anchor="middle" class="number">1</text>
  <text x="145" y="251" class="step">입력 검증</text>
  <text x="100" y="296" class="body">사업장·주차·제출 마감 검증</text>
  <text x="100" y="325" class="body">충족 불가능한 조건 즉시 종료</text>

  <circle cx="515" cy="245" r="22" fill="#0084ff"/><text x="515" y="251" text-anchor="middle" class="number">2</text>
  <text x="550" y="251" class="step">슬롯·후보 구성</text>
  <text x="505" y="296" class="body">근무 파트별 가능 근무자 계산</text>
  <text x="505" y="325" class="body">근무 불가능 제출 시간 제외</text>

  <circle cx="920" cy="245" r="22" fill="#0084ff"/><text x="920" y="251" text-anchor="middle" class="number">3</text>
  <text x="955" y="251" class="step">Dynamic MRV</text>
  <text x="910" y="296" class="body">가능 조합이 가장 적은 슬롯</text>
  <text x="910" y="325" class="body">우선 선택으로 분기 축소</text>

  <circle cx="1325" cy="245" r="22" fill="#0084ff"/><text x="1325" y="251" text-anchor="middle" class="number">4</text>
  <text x="1360" y="251" class="step">우선순위</text>
  <text x="1315" y="296" class="body">부족 인원·희소성 기반</text>
  <text x="1315" y="325" class="body">근무자 조합 순서 결정</text>

  <path d="M380 280 L475 280" class="flow"/>
  <path d="M785 280 L880 280" class="flow"/>
  <path d="M1190 280 L1285 280" class="flow"/>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="1285" y="500" width="245" height="150" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="880" y="500" width="310" height="150" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="475" y="500" width="310" height="150" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="70" y="500" width="310" height="150" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  </g>

  <circle cx="1325" cy="540" r="22" fill="#7c3aed"/><text x="1325" y="546" text-anchor="middle" class="number">5</text>
  <text x="1360" y="546" class="step">Lazy 조합</text>
  <text x="1315" y="591" class="body">조합 목록을 만들지 않고</text>
  <text x="1315" y="620" class="body">생성 즉시 DFS 탐색</text>

  <circle cx="920" cy="540" r="22" fill="#7c3aed"/><text x="920" y="546" text-anchor="middle" class="number">6</text>
  <text x="955" y="546" class="step">Forward Checking</text>
  <text x="910" y="591" class="body">남은 슬롯으로 최소 조건을</text>
  <text x="910" y="620" class="body">충족할 수 없으면 가지치기</text>

  <circle cx="515" cy="540" r="22" fill="#7c3aed"/><text x="515" y="546" text-anchor="middle" class="number">7</text>
  <text x="550" y="546" class="step">후보 정규화</text>
  <text x="505" y="591" class="body">동일한 주간 배정 결과 제거</text>
  <text x="505" y="620" class="body">중복 없는 후보만 유지</text>

  <circle cx="110" cy="540" r="22" fill="#7c3aed"/><text x="110" y="546" text-anchor="middle" class="number">8</text>
  <text x="145" y="546" class="step">공정성 평가</text>
  <text x="100" y="591" class="body">근무 파트 배정 수 편차 비교</text>
  <text x="100" y="620" class="body">상위 후보 최대 50개 반환</text>

  <path d="M1408 355 L1408 500" class="flow"/>
  <path d="M1285 575 L1190 575" class="flow"/>
  <path d="M880 575 L785 575" class="flow"/>
  <path d="M475 575 L380 575" class="flow"/>

  <rect x="310" y="730" width="980" height="95" rx="24" fill="#e8f3ff"/>
  <text x="800" y="770" text-anchor="middle" class="step">탐색 공간과 메모리 사용량을 제한하면서 유효하고 다양한 주간 스케줄 후보 생성</text>
  <text x="800" y="802" text-anchor="middle" class="body">선택 제한일은 제출 조건과 분리해 완전 균등 무작위 배정을 유지합니다.</text>
</svg>
