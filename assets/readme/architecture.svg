<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">착착 운영 아키텍처</title>
  <desc id="desc">Flutter 모바일 앱, Nginx, Spring Boot Docker, MySQL, Redis, AWS S3, Firebase FCM, 소셜 인증 제공자의 연결 구조</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0084ff"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #64748b; }
      .group-title { font: 700 22px Arial, sans-serif; fill: #334155; }
      .card-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 17px Arial, sans-serif; fill: #475569; }
      .small { font: 600 15px Arial, sans-serif; fill: #64748b; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #0084ff; stroke-width: 4; marker-end: url(#arrowBlue); }
      .flow-dashed { fill: none; stroke: #0084ff; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fbff"/>
  <circle cx="1450" cy="90" r="170" fill="#e8f3ff"/>
  <circle cx="100" cy="850" r="210" fill="#eef8f4"/>

  <text x="64" y="70" class="title">착착 운영 아키텍처</text>
  <text x="64" y="108" class="subtitle">모바일 클라이언트와 Spring Boot API 서버를 중심으로 구성한 서비스 운영 구조</text>

  <!-- Mobile client -->
  <g filter="url(#shadow)">
    <rect x="60" y="245" width="270" height="350" rx="22" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <rect x="88" y="275" width="54" height="54" rx="15" fill="#dff3ff"/>
  <text x="115" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0084ff">F</text>
  <text x="160" y="310" class="card-title">Flutter App</text>
  <text x="88" y="365" class="body">Android / iOS</text>
  <text x="88" y="407" class="body">REST API 호출</text>
  <text x="88" y="449" class="body">JWT 인증</text>
  <text x="88" y="491" class="body">S3 이미지 직접 업로드</text>
  <text x="88" y="533" class="body">FCM 푸시 수신</text>

  <!-- Reverse proxy -->
  <!-- AWS Cloud -->
  <rect x="365" y="150" width="895" height="670" rx="30" fill="#fffdfa" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 9"/>
  <rect x="397" y="178" width="140" height="42" rx="21" fill="#fff1cc"/>
  <text x="467" y="206" text-anchor="middle" class="group-title" fill="#b45309">AWS Cloud</text>

  <!-- EC2 -->
  <rect x="400" y="248" width="802" height="355" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="430" y="288" class="group-title">EC2 · Ubuntu</text>
  <text x="1172" y="288" text-anchor="end" class="small">운영 서버</text>

  <g filter="url(#shadow)">
    <rect x="430" y="330" width="190" height="165" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <circle cx="525" cy="375" r="27" fill="#16a34a"/>
  <text x="525" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">N</text>
  <text x="525" y="430" text-anchor="middle" class="card-title">Nginx</text>
  <text x="525" y="463" text-anchor="middle" class="small">HTTPS / Reverse Proxy</text>
  <text x="525" y="486" text-anchor="middle" class="small">EC2 직접 설치</text>

  <g filter="url(#shadow)">
    <rect x="680" y="320" width="455" height="140" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <circle cx="732" cy="370" r="28" fill="#0084ff"/>
  <text x="732" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">SB</text>
  <text x="780" y="370" class="card-title">Spring Boot API</text>
  <text x="780" y="405" class="body">Java 21 · Docker Container</text>
  <text x="780" y="435" class="small">Security · JPA · REST · Event Listener</text>

  <rect x="680" y="500" width="205" height="72" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="702" y="531" class="card-title" font-size="20">MySQL</text>
  <text x="702" y="558" class="small">영속 데이터 · 직접 설치</text>

  <rect x="930" y="500" width="230" height="72" rx="16" fill="#fff1f2" stroke="#fda4af"/>
  <text x="952" y="531" class="card-title" font-size="20">Redis</text>
  <text x="952" y="558" class="small">Refresh Token · 직접 설치</text>

  <!-- S3 -->
  <g filter="url(#shadow)">
    <rect x="760" y="670" width="365" height="105" rx="20" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
  </g>
  <circle cx="810" cy="721" r="27" fill="#f59e0b"/>
  <text x="810" y="729" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">S3</text>
  <text x="855" y="714" class="card-title">Amazon S3</text>
  <text x="855" y="746" class="small">Presigned URL · 이미지 저장</text>

  <!-- External services -->
  <g filter="url(#shadow)">
    <rect x="1320" y="245" width="225" height="145" rx="20" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  </g>
  <text x="1348" y="287" class="card-title">Social Auth</text>
  <text x="1348" y="327" class="body">Google · Kakao · Apple</text>
  <text x="1348" y="360" class="small">토큰 검증 / 사용자 식별</text>

  <g filter="url(#shadow)">
    <rect x="1320" y="495" width="225" height="145" rx="20" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <text x="1348" y="537" class="card-title">Firebase FCM</text>
  <text x="1348" y="577" class="body">앱 푸시 발송</text>
  <text x="1348" y="610" class="small">커밋 이후 이벤트 처리</text>

  <!-- Main flows -->
  <path d="M330 410 L430 410" class="flow-blue"/>
  <text x="375" y="393" text-anchor="middle" class="small">HTTPS</text>
  <path d="M620 410 L680 390" class="flow-blue"/>
  <text x="650" y="375" text-anchor="middle" class="small">REST API</text>

  <path d="M810 460 L783 500" class="flow"/>
  <path d="M1015 460 L1045 500" class="flow"/>
  <path d="M907 460 L945 670" class="flow-dashed"/>
  <text x="962" y="632" class="small">서명 URL 발급</text>

  <path d="M1135 360 L1320 318" class="flow"/>
  <path d="M1135 418 L1320 555" class="flow"/>

  <path d="M330 545 C470 760, 565 770, 760 722" class="flow-dashed"/>
  <text x="500" y="750" class="small">Presigned URL로 직접 PUT</text>
  <path d="M1320 605 C1110 850, 320 825, 225 595" class="flow-dashed"/>
  <text x="1240" y="772" class="small">Push Notification</text>

  <text x="64" y="858" class="small">인증 정보와 운영 비밀값은 환경변수 및 배포 시점의 비공개 파일로 주입합니다.</text>
</svg>
